name: probe-and-build

# 放到 fork 的 .github/workflows/build.yml
# 手动触发或任意分支推送都会跑

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Probe toolchain
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path ci-report | Out-Null
          $out = @()
          $out += "=== Visual Studio ==="
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $out += (& $vswhere -all -products * -property installationPath)
            $out += (& $vswhere -all -products * -property catalog_productDisplayVersion)
          } else { $out += "vswhere not found" }
          $out += ""
          $out += "=== vcpkg ==="
          $out += "VCPKG_INSTALLATION_ROOT=$env:VCPKG_INSTALLATION_ROOT"
          $out += "vcpkg.json exists: $(Test-Path vcpkg.json)"
          $out += "slnx exists: $(Test-Path TranslucentTB.slnx)"
          $out += "vcpkg-configuration.json exists: $(Test-Path vcpkg-configuration.json)"
          $out += ""
          $out += "=== NuGet configuration ==="
          Get-ChildItem -Recurse -Filter NuGet.config -ErrorAction SilentlyContinue | ForEach-Object { $out += "--- $($_.FullName) ---"; $out += (Get-Content $_.FullName -Raw) }
          $out += ""
          $out += "=== MSBuild ==="
          $msb = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter MSBuild.exe -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match 'Bin\\MSBuild.exe$' } | Select-Object -First 1
          if ($msb) { $out += $msb.FullName; $out += (& $msb.FullName -version) } else { $out += "MSBuild not found" }
          $out | Tee-Object -FilePath ci-report\probe.txt

      - name: Integrate vcpkg
        shell: pwsh
        continue-on-error: true
        run: |
          if (Test-Path "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe") {
            & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install
          } else { "vcpkg.exe not found at $env:VCPKG_INSTALLATION_ROOT" }

      - name: Cache vcpkg installed
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Restore
        shell: pwsh
        run: |
          $msb = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter MSBuild.exe -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match 'Bin\\MSBuild.exe$' } | Select-Object -First 1
          if (-not $msb) { throw "MSBuild not found" }
          & $msb.FullName "TranslucentTB.slnx" -t:Restore -p:RestorePackagesConfig=true -p:Platform=x64 -p:Configuration=Release /v:m 2>&1 |
            Tee-Object -FilePath ci-report\restore.txt
          if ($LASTEXITCODE -ne 0) { throw "restore failed with $LASTEXITCODE" }

      - name: Apply experimental patch
        shell: pwsh
        run: |
          $p = "ExplorerTAP\visualtreewatcher.cpp"
          $src = Get-Content $p -Raw
          $anchor = 'const auto rootGrid = FromHandle<wux::UIElement>(relation.Parent);'
          $oldIf = 'if (content == rootGrid)'
          if (-not $src.Contains($anchor)) { throw "anchor 1 not found" }
          if (-not $src.Contains($oldIf)) { throw "anchor 2 not found" }
          $t = [char]9
          $i3 = "$t$t$t"
          $i4 = "$i3$t"
          $i5 = "$i4$t"
          $i6 = "$i5$t"
          $lambda = @(
            '',
            ($i3 + '// 26H2 wraps the taskbar frame in ScrollViewer / ScrollContentPresenter / Border,'),
            ($i3 + '// so the frame parent is no longer the DesktopWindowXamlSource content.'),
            ($i3 + '// Walk up the ancestor chain instead of assuming a single level.'),
            ($i3 + 'const auto isSameOrAncestor = [](wux::DependencyObject ancestor, wux::DependencyObject node)'),
            ($i3 + '{'),
            ($i4 + 'for (auto current = node; current; current = wux::Media::VisualTreeHelper::GetParent(current))'),
            ($i4 + '{'),
            ($i5 + 'if (current == ancestor)'),
            ($i5 + '{'),
            ($i6 + 'return true;'),
            ($i5 + '}'),
            ($i4 + '}'),
            '',
            ($i4 + 'return false;'),
            ($i3 + '};')
          ) -join "`r`n"
          $src = $src.Replace($anchor, $anchor + $lambda)
          $src = $src.Replace($oldIf, 'if (isSameOrAncestor(content, rootGrid))')
          if (-not $src.Contains('auto current = node; current;')) { throw "patch sanity check failed" }
          if (-not $src.Contains('const auto isSameOrAncestor')) { throw "patch sanity check failed" }
          if (-not $src.Contains('return true;')) { throw "patch sanity check failed" }
          Set-Content $p $src -NoNewline -Encoding utf8
          git diff -- ExplorerTAP/visualtreewatcher.cpp | Tee-Object ci-report\patch.txt

      - name: Build
        shell: pwsh
        run: |
          $msb = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter MSBuild.exe -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match 'Bin\\MSBuild.exe$' } | Select-Object -First 1
          if (-not $msb) { throw "MSBuild not found" }
          # deliberately no /m and no /restore: match upstream VSBuild@1 defaults
          & $msb.FullName "TranslucentTB.slnx" /p:Configuration=Release /p:Platform=x64 /p:BuildType=Dev /v:m 2>&1 |
            Tee-Object -FilePath ci-report\build.txt
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with $LASTEXITCODE" }

      - name: Extract errors
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-report | Out-Null
          if (Test-Path ci-report\build.txt) {
            Select-String -Path ci-report\build.txt -Pattern ': error' |
              ForEach-Object { $_.Line } | Set-Content ci-report\errors.txt
            "---- last 120 lines ----" | Add-Content ci-report\errors.txt
            Get-Content ci-report\build.txt -Tail 120 | Add-Content ci-report\errors.txt
          } else { "build.txt not found" | Set-Content ci-report\errors.txt }

      - name: Package portable
        shell: pwsh
        continue-on-error: true
        run: |
          $src = "AppPackage\bin\x64\Release"
          New-Item -ItemType Directory -Force -Path out\upload | Out-Null
          if (Test-Path $src) {
            "==== source: $src ====" | Add-Content ci-report\probe.txt
            Get-ChildItem $src -Recurse | Select-Object -First 60 FullName | Out-String | Add-Content ci-report\probe.txt
            Copy-Item "$src\*" -Destination out\upload -Recurse -Force
          } else {
            "AppPackage output not found: $src" | Add-Content ci-report\probe.txt
          }
          "==== packaged ====" | Add-Content ci-report\probe.txt
          Get-ChildItem out\upload -Recurse | Select-Object -First 60 FullName | Out-String | Add-Content ci-report\probe.txt

      - name: Upload portable
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-x64-release
          path: out/upload
          if-no-files-found: warn
          retention-days: 3

      - name: Report back into the repo
        if: always()
        shell: pwsh
        run: |
          git config user.name "ci-probe"
          git config user.email "ci-probe@users.noreply.github.com"
          Get-ChildItem ci-report -File -ErrorAction SilentlyContinue | ForEach-Object { "---- $($_.Name) ----"; Get-Content $_.FullName -Tail 80 }
          git add ci-report -f
          git commit -m "ci: report $(Get-Date -Format u)" --allow-empty
          git push || echo "push failed"
